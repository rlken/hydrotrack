<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><title>Fountains — HydroTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout :: layout(~{::section})}">
<section>
    <div class="page-header">
        <div>
            <h2>Water Fountains</h2>
            <p>All fountains &amp; dispensers in NU Manila Main Building</p>
        </div>
        <a th:href="@{/fountains/new}" class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','TECHNICIAN')">+ Add Fountain</a>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
        <form th:action="@{/fountains}" method="get" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <select name="floor" class="form-control" style="width:auto" onchange="this.form.submit()">
                <option value="">All Floors</option>
                <option th:each="f : ${floors}" th:value="${f}" th:text="'Floor ' + ${f}" th:selected="${f == selectedFloor}"></option>
            </select>
            <select name="status" class="form-control" style="width:auto" onchange="this.form.submit()">
                <option value="">All Status</option>
                <option value="OPERATIONAL" th:selected="${'OPERATIONAL' == selectedStatus}">Operational</option>
                <option value="NEEDS_MAINTENANCE" th:selected="${'NEEDS_MAINTENANCE' == selectedStatus}">Needs Maintenance</option>
                <option value="OUT_OF_SERVICE" th:selected="${'OUT_OF_SERVICE' == selectedStatus}">Out of Service</option>
                <option value="UNDER_REPAIR" th:selected="${'UNDER_REPAIR' == selectedStatus}">Under Repair</option>
            </select>
            <a th:href="@{/fountains}" class="btn btn-sm btn-secondary">Clear</a>
        </form>
    </div>

    <!-- Fountain Grid -->
    <div class="fountain-grid">
        <a th:each="f : ${fountains}" th:href="@{/fountains/{id}(id=${f.fountainId})}" class="fountain-card">
            <div class="fc-header">
                <div>
                    <div class="fc-code" th:text="${f.fountainCode}">NM-G01</div>
                    <div class="fc-type" th:text="${#strings.replace(f.fountainType, '_', ' ')}">WATER DISPENSER</div>
                </div>
                <span class="badge"
                    th:classappend="${f.status == 'OPERATIONAL'} ? 'badge-green' : (${f.status == 'NEEDS_MAINTENANCE'} ? 'badge-orange' : (${f.status == 'OUT_OF_SERVICE'} ? 'badge-red' : 'badge-yellow'))"
                    th:text="${#strings.replace(f.status, '_', ' ')}">OPERATIONAL</span>
            </div>
            <div class="fc-location">📍 <span th:text="${f.locationDescription}">Ground Floor Lobby</span></div>
            <div class="fc-metrics">
                <div class="fc-metric">
                    <strong th:text="'F' + ${f.floorNumber}">F1</strong>
                    Floor
                </div>
                <div class="fc-metric" th:if="${f.lastFilterChange != null}">
                    <strong th:text="${f.lastFilterChange}">2025-03-01</strong>
                    Last Filter
                </div>
            </div>
        </a>
    </div>

    <div th:if="${#lists.isEmpty(fountains)}" class="empty-state">
        <div class="icon">🚰</div>
        <p>No fountains found matching your criteria</p>
    </div>
</section>
</div>
</body>
</html>
