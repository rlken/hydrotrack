<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Fountain Form — HydroTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout :: layout(~{::section})}">
<section>
    <div class="page-header">
        <div>
            <h2 th:text="${fountain != null} ? 'Edit Fountain' : 'Add New Fountain'">Add New Fountain</h2>
            <p>NU Manila Main Building</p>
        </div>
        <a th:href="@{/fountains}" class="btn btn-secondary btn-sm">← Back</a>
    </div>

    <div class="form-container">
        <form th:action="${fountain != null} ? @{/fountains/edit/{id}(id=${fountain.fountainId})} : @{/fountains/new}" method="post">
            <div class="form-row">
                <div class="form-group" th:if="${fountain == null}">
                    <label>Fountain Code</label>
                    <input type="text" name="fountainCode" class="form-control" placeholder="e.g., NM-G01" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select name="fountainType" class="form-control" required>
                        <option value="WATER_DISPENSER" th:selected="${fountain != null && fountain.fountainType == 'WATER_DISPENSER'}">Water Dispenser</option>
                        <option value="DRINKING_FOUNTAIN" th:selected="${fountain != null && fountain.fountainType == 'DRINKING_FOUNTAIN'}">Drinking Fountain</option>
                        <option value="BOTTLE_REFILL" th:selected="${fountain != null && fountain.fountainType == 'BOTTLE_REFILL'}">Bottle Refill Station</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Floor Number</label>
                    <input type="number" name="floorNumber" class="form-control" min="1" max="8" th:value="${fountain != null} ? ${fountain.floorNumber} : ''" required>
                </div>
                <div class="form-group" th:if="${fountain == null}">
                    <label>Installation Date</label>
                    <input type="date" name="installationDate" class="form-control">
                </div>
                <div class="form-group" th:if="${fountain != null}">
                    <label>Status</label>
                    <select name="status" class="form-control">
                        <option value="OPERATIONAL" th:selected="${fountain.status == 'OPERATIONAL'}">Operational</option>
                        <option value="NEEDS_MAINTENANCE" th:selected="${fountain.status == 'NEEDS_MAINTENANCE'}">Needs Maintenance</option>
                        <option value="OUT_OF_SERVICE" th:selected="${fountain.status == 'OUT_OF_SERVICE'}">Out of Service</option>
                        <option value="UNDER_REPAIR" th:selected="${fountain.status == 'UNDER_REPAIR'}">Under Repair</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Location Description</label>
                <input type="text" name="locationDescription" class="form-control" placeholder="e.g., Ground Floor Lobby, near Guard Station" th:value="${fountain != null} ? ${fountain.locationDescription} : ''">
            </div>
            <button type="submit" class="btn btn-primary" th:text="${fountain != null} ? 'Update Fountain' : 'Add Fountain'">Add Fountain</button>
        </form>
    </div>
</section>
</div>
</body>
</html>
