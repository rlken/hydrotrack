<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroTrack — Water Quality Monitoring</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:fragment="layout(content)" class="app-layout">
    <button class="mobile-toggle" aria-label="Open navigation">
        <span class="ui-icon icon-menu" aria-hidden="true"></span>
    </button>
    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark") {
                document.body.classList.add("dark");
            } else {
                document.body.classList.remove("dark");
            }
        })();
        window.toggleDarkMode = function() {
            document.body.classList.toggle("dark");
            const btn = document.getElementById("theme-btn");
            
            if (document.body.classList.contains("dark")) {
                localStorage.setItem("theme", "dark");
                if (btn) btn.textContent = "Light Mode";
            } else {
                localStorage.setItem("theme", "light");
                if (btn) btn.textContent = "Dark Mode";
            }
        };
        window.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById("theme-btn");
            if (localStorage.getItem("theme") === "dark" && btn) {
                btn.textContent = "Light Mode";
            }
        });
    </script>
    
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1><span class="brand-icon" aria-hidden="true"></span> HydroTrack</h1>
            <span>NU Manila Main Building</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title" sec:authorize="!hasRole('VIEWER')">Overview</div>
                <div class="nav-section-title" sec:authorize="hasRole('VIEWER')">Guest View</div>
                <a th:href="@{/dashboard}" class="nav-link" th:classappend="${#strings.startsWith(requestURI,'/dashboard')} ? 'active'">
                    <span class="ui-icon icon-dashboard" aria-hidden="true"></span>
                    <span sec:authorize="!hasRole('VIEWER')">Dashboard</span>
                    <span sec:authorize="hasRole('VIEWER')">Water Overview</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title" sec:authorize="!hasRole('VIEWER')">Management</div>
                <div class="nav-section-title" sec:authorize="hasRole('VIEWER')">Explore</div>
                <a th:href="@{/fountains}" class="nav-link" th:classappend="${#strings.startsWith(requestURI,'/fountains')} ? 'active'">
                    <span class="ui-icon icon-fountain" aria-hidden="true"></span>
                    <span sec:authorize="!hasRole('VIEWER')">Fountains</span>
                    <span sec:authorize="hasRole('VIEWER')">Find Stations</span>
                </a>
                <a th:href="@{/quality}" class="nav-link" th:classappend="${#strings.startsWith(requestURI,'/quality')} ? 'active'" sec:authorize="!hasRole('VIEWER')">
                    <span class="ui-icon icon-quality" aria-hidden="true"></span> Water Quality
                </a>
                <a th:href="@{/schedules}" class="nav-link" th:classappend="${#strings.startsWith(requestURI,'/schedules')} ? 'active'" sec:authorize="!hasRole('VIEWER')">
                    <span class="ui-icon icon-calendar" aria-hidden="true"></span> Filter Schedules
                </a>
                <a th:href="@{/maintenance}" class="nav-link" th:classappend="${#strings.startsWith(requestURI,'/maintenance')} ? 'active'" sec:authorize="!hasRole('VIEWER')">
                    <span class="ui-icon icon-maintenance" aria-hidden="true"></span> Maintenance
                </a>
            </div>
            <div class="nav-section" sec:authorize="hasRole('ADMIN')">
                <div class="nav-section-title">Admin</div>
                <a th:href="@{/admin/users}" class="nav-link" th:classappend="${#strings.startsWith(requestURI,'/admin')} ? 'active'">
                    <span class="ui-icon icon-users" aria-hidden="true"></span> User Management
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name,0,1))}">A</div>
                <div>
                    <div style="font-weight:600;color:var(--text-primary);font-size:14px" th:text="${#authentication.name}">admin</div>
                    <div style="font-size:11px" th:each="auth : ${#authentication.authorities}" th:text="${#strings.replace(auth,'ROLE_','')}">ADMIN</div>
                </div>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">Sign Out</button>
            </form>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div th:if="${success}" class="alert alert-success"><span class="ui-icon icon-check" aria-hidden="true"></span><span th:text="${success}"></span></div>
        <div th:if="${error}" class="alert alert-error"><span class="ui-icon icon-alert" aria-hidden="true"></span><span th:text="${error}"></span></div>
        <div th:replace="${content}"></div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
