<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><title>Maintenance — HydroTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout :: layout(~{::section})}">
<section>
    <div class="page-header">
        <div><h2>Maintenance Logs</h2><p>History of all maintenance activities</p></div>
        <a th:href="@{/maintenance/new}" class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','TECHNICIAN')">+ Log Maintenance</a>
    </div>
    <div class="table-container">
        <table>
            <thead><tr><th>Date</th><th>Fountain</th><th>Floor</th><th>Type</th><th>Description</th><th>Technician</th><th>Cost</th></tr></thead>
            <tbody>
                <tr th:each="m : ${logs}">
                    <td th:text="${#temporals.format(m.performedAt, 'MMM dd, yyyy')}"></td>
                    <td><a th:href="@{/fountains/{id}(id=${m.fountain.fountainId})}" th:text="${m.fountain.fountainCode}"></a></td>
                    <td th:text="${floorLabel.apply(m.fountain.floorNumber)}"></td>
                    <td><span class="badge badge-gray" th:text="${#strings.replace(m.maintenanceType,'_',' ')}"></span></td>
                    <td th:text="${m.description}"></td>
                    <td th:text="${m.performedBy.fullName}"></td>
                    <td th:text="${m.cost != null} ? '₱' + ${#numbers.formatDecimal(m.cost, 1, 2)} : '—'"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}"><td colspan="7" class="text-center" style="padding:30px;color:var(--text-tertiary)">No maintenance records yet</td></tr>
            </tbody>
        </table>
    </div>
</section>
</div>
</body>
</html>
