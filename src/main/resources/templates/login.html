<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroTrack — Sign In</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="logo">💧</div>
        <h2>HydroTrack</h2>
        <p>Water Quality Monitoring System</p>

        <div th:if="${param.error}" class="alert alert-error" style="text-align:left">
            ❌ Invalid username or password
        </div>
        <div th:if="${param.logout}" class="alert alert-success" style="text-align:left">
            ✅ You have been signed out
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <p style="margin-top:20px;font-size:12px;color:var(--text-tertiary)">NU Manila · SDG 6: Clean Water and Sanitation</p>
    </div>
</div>
</body>
</html>
