# ============================
# HydroTrack Configuration
# ============================

spring.application.name=HydroTrack

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/hydrotrack?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- SQL Init ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Server ----
server.port=8080
server.error.whitelabel.enabled=false

# ---- Logging ----
logging.level.com.hydrotrack=DEBUG
logging.level.org.springframework.security=INFO
